<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Check a spot — Router placement demo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0.5" width="3" height="11.5" rx="0.5" fill="currentColor"/></svg>
      <span class="status-5g">5G</span>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <button class="icon-btn" id="backBtn" aria-label="Back">
      <svg width="20" height="18" viewBox="0 0 20 18" fill="none"><path d="M9 1L1 9L9 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 9H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h1 class="app-title">Check a spot</h1>
    <button class="icon-btn" id="chatBtn" aria-label="Chat">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1C5 1 1 4.4 1 8.6c0 2.4 1.3 4.5 3.3 5.9-.1.9-.5 2.2-1.5 3.3 0 0 2.3-.2 4.3-1.7.9.3 1.9.4 2.9.4 5 0 9-3.4 9-7.9S15 1 10 1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Stepper -->
  <div class="stepper" id="stepper">
    <div class="step" data-step="0">
      <div class="step-circle"><svg class="ic-pin" viewBox="0 0 16 20" fill="none"><path d="M8 0C3.6 0 0 3.5 0 7.8 0 13.6 8 20 8 20s8-6.4 8-12.2C16 3.5 12.4 0 8 0Z" fill="currentColor"/><circle cx="8" cy="7.5" r="3" fill="#fff"/></svg></div>
      <span class="step-label">Spot 1</span>
    </div>
    <div class="step-line"></div>
    <div class="step" data-step="1">
      <div class="step-circle"><svg class="ic-pin" viewBox="0 0 16 20" fill="none"><path d="M8 0C3.6 0 0 3.5 0 7.8 0 13.6 8 20 8 20s8-6.4 8-12.2C16 3.5 12.4 0 8 0Z" fill="currentColor"/><circle cx="8" cy="7.5" r="3" fill="#fff"/></svg></div>
      <span class="step-label">Spot 2</span>
    </div>
    <div class="step-line"></div>
    <div class="step" data-step="2">
      <div class="step-circle"><svg class="ic-pin" viewBox="0 0 16 20" fill="none"><path d="M8 0C3.6 0 0 3.5 0 7.8 0 13.6 8 20 8 20s8-6.4 8-12.2C16 3.5 12.4 0 8 0Z" fill="currentColor"/><circle cx="8" cy="7.5" r="3" fill="#fff"/></svg></div>
      <span class="step-label">Spot 3</span>
    </div>
    <div class="step-line"></div>
    <div class="step" data-step="3">
      <div class="step-circle"><svg class="ic-bars" viewBox="0 0 16 16" fill="none"><rect x="0" y="10" width="3" height="6" rx="1" fill="currentColor"/><rect x="5" y="6" width="3" height="10" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="14" rx="1" fill="currentColor"/></svg></div>
      <span class="step-label">Results</span>
    </div>
  </div>

  <!-- Info banner (transient, tells presenter which tracking mode is active) -->
  <div class="info-banner" id="permBanner"><span id="permBannerText">Checking device location…</span></div>

  <!-- Live map card -->
  <div class="map-card">
    <div id="map"></div>

    <div id="liveMarker" class="live-marker">
      <svg width="140" height="140" viewBox="-70 -70 140 140">
        <defs>
          <radialGradient id="coneGradient" cx="50%" cy="0%" r="100%">
            <stop offset="0%" stop-color="#0089EC" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#0089EC" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle id="pulse" r="10" class="pulse-ring" />
        <g id="coneGroup">
          <path id="cone" fill="url(#coneGradient)" />
        </g>
        <circle r="9" fill="#ffffff" />
        <circle r="6" fill="#0089EC" />
      </svg>
    </div>

    <div id="locoff-badge" class="locoff hidden">
      <svg width="26" height="26" viewBox="0 0 26 26">
        <circle cx="13" cy="13" r="13" fill="#A7A7A7" />
        <g transform="translate(6,6)" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round">
          <path d="M7 1C4 1 1.4 3.2 1.4 7c0 3.2 4 8 5.6 9.9C8.6 15 12.6 10.2 12.6 7 12.6 3.2 10 1 7 1Z"/>
          <path d="M1 1L13 13" stroke-opacity="0.95"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Text panel -->
  <div class="text-panel">
    <h2 id="panelTitle" class="panel-title"></h2>
    <p id="panelSubtitle" class="panel-subtitle"></p>
  </div>

  <!-- CTA -->
  <button id="ctaBtn" class="cta">Check this spot</button>

</div>

<script src="mapsConfig.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(window.GOOGLE_MAPS_API_KEY || '') + '&callback=initMap&loading=async';
    s.async = true;
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
